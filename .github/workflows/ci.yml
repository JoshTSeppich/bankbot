# The same four gates the pre-commit hook runs, plus a Chromium install so the
# surface tests can drive the demo app. One job, so a red badge means one thing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: this is the repo whose argument is frozen inputs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy --strict
      - run: uv run pytest
