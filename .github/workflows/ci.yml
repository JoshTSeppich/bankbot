# The same gates the pre-commit hook runs, plus a Chromium install so the
# surface tests can drive the demo app. One job, so a red badge means one thing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy --strict
      - run: uv run pytest
      - run: make verify-evidence
