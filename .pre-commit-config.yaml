# Enforces the CLAUDE.md pre-commit contract:
#   uv run ruff format && uv run ruff check && uv run mypy && uv run pytest
# plus a secret scan. I made the four Python hooks `language: system` so they
# use the versions pinned in uv.lock rather than a second copy managed by
# pre-commit. They run over the whole package (not just staged files) whenever
# a Python file is staged, because mypy and pytest only mean something whole.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

      # Runs on every commit, not only when a file under evidence/ is staged.
      # The problem this catches is the opposite shape: the redactor improved,
      # the committed traces did not, and nothing under evidence/ changed for a
      # file filter to notice. It calls the same make target the README points a
      # reviewer at, which provisions .env so the redactor knows the demo
      # credentials; without them the check silently weakens to pattern matching.
      - id: verify-evidence
        name: verify evidence
        entry: make verify-evidence
        language: system
        always_run: true
        pass_filenames: false

      # CLAUDE.md calls a 72-character subject non-negotiable and fifteen
      # earlier subjects ran past it. pygrep --negate fails the commit when the
      # message does NOT match, so the pattern has to accept the whole subject
      # line: a length lookahead that stops at the first newline, then the
      # Conventional Commits shape. Body lines are never examined.
      - id: commit-subject
        name: conventional subject, 72 characters at most
        language: pygrep
        entry: '\A(?=[^\n]{1,72}(\n|\Z))(feat|fix|refactor|test|docs|chore|evidence)(\([a-z/_-]+\))?: \S'
        args: [--multiline, --negate]
        stages: [commit-msg]

  # Blocks the commit if a staged change contains anything that looks like a
  # secret (API keys, tokens). Scans staged content only, so unstaged scratch
  # such as spike/ is not in scope.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
