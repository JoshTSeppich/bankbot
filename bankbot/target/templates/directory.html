{% extends "page.html" %}
{% block content %}
<h1>Member directory</h1>
<table class="results">
  <thead>
    <tr><th>Member ID</th><th>Name</th><th>Branch</th></tr>
  </thead>
  <tbody>
    {% for member in members %}
    <tr>
      <td><a href="{{ variant.prefix }}/members/profile?member={{ member.member_id }}">{{ member.member_id }}</a></td>
      <td>{{ member.name }}</td>
      <td>{{ member.branch }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
