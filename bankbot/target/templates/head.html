<meta charset="utf-8">
<meta name="application-version" content="{{ variant.application_version }}">
<title>{{ title | default("Legacy Core Teller") }}</title>
<style>
  body { margin: 0; background: #d4d0c8; font: 13px Verdana, Geneva, sans-serif; color: #000; }
  table.frame { width: 100%; border-collapse: collapse; }
  td.banner { background: #003366; color: #fff; padding: 6px 10px; font-weight: bold; }
  td.banner.right { text-align: right; font-weight: normal; }
  td.content { background: #fff; padding: 14px; vertical-align: top; }
  h1 { font-size: 16px; margin: 0 0 10px 0; }
  table.results, table.accounts { border-collapse: collapse; margin: 8px 0; }
  table.results th, table.results td, table.accounts th, table.accounts td {
    border: 1px solid #888; padding: 3px 10px; text-align: left; white-space: nowrap;
  }
  table.results th, table.accounts thead th { background: #e8e8e8; }
  form table td { padding: 3px 6px; }
  iframe { border: 1px inset #888; background: #fff; }
  .notice { color: #900; }
</style>
