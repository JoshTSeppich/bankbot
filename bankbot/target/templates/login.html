{% extends "page.html" %}
{% block content %}
<h1>Teller sign in</h1>
{% if error %}<p class="notice">{{ error }}</p>{% endif %}
<form method="post" action="{{ variant.prefix }}/login">
  <table>
    <tr>
      <td><label>Username <input type="text" name="username" size="20" autocomplete="off"></label></td>
    </tr>
    <tr>
      <td><label>Password <input type="password" name="password" size="20" autocomplete="off"></label></td>
    </tr>
    <tr>
      <td><button type="submit">Sign in</button></td>
    </tr>
  </table>
</form>
{% endblock %}
