# What the automation may do against the bank application. Anything not
# listed here is blocked. Loaded by bankbot/policy; see docs/adr/0005-policy-model.md.

# Hosts: keeps the agent on the bank application and off every other site.
allowed_hosts:
  - 127.0.0.1
  - localhost

# Routes (patterns matched against the URL path): keeps the agent inside the
# member workflow and out of pages such as /admin. "(b/)?" covers variant B.
allowed_routes:
  - "^/$"
  - "^/b/?$"
  - "^/(b/)?login$"
  - "^/(b/)?members/.*"

# Actions: the only kinds of browser action the agent may take.
allowed_actions: [navigate, click, type, select, extract, assert, wait]

# Risky: anything matching here needs a human before it runs, because it
# cannot be undone. Routes match the URL path; controls match the button name.
risky:
  routes:
    - "/close$"
    - "/transfer"
  controls:
    - "^Close account$"
    - "^Confirm$"
    - "^Submit$"
    - "^Transfer$"

# Redaction: keeps credentials and member data out of logs and screenshots.
redaction:
  # Any environment variable whose name ends in one of these holds a secret.
  secret_env_suffixes: [_KEY, _TOKEN, _SECRET, _ID, _PASSWORD]
  # Fields blurred in every screenshot before it is saved.
  mask_selectors: ["input[type=password]"]
  # Cookies whose value is masked wherever it is written down. By name, not by
  # value: the application mints a session after the login, long after the
  # redactor was built, so nothing can hand it the value to look for.
  secret_cookie_names: [teller_session]

# Variant drift: a key screen's tab sequence is compared to the recording
# by edit distance. More than this share of the sequence changed means the
# app is not the build the capability was recorded on.
fingerprint:
  max_distance_ratio: 0.25
